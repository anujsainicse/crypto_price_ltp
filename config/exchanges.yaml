binance:
  name: "Binance"
  enabled: true
  services:
    spot:
      enabled: true
      auto_start: true
      websocket_url: "wss://stream.binance.com:9443"
      symbols:
        - "BTCUSDT"
        - "ETHUSDT"
        - "SOLUSDT"
        - "BNBUSDT"
        - "DOGEUSDT"
      reconnect_interval: 5
      max_reconnect_attempts: 10
      redis_prefix: "binance_spot"
      redis_ttl: 60
      # Quote currencies to strip from symbols (order matters - longest first)
      quote_currencies:
        - "USDT"
        - "USDC"
        - "BTC"
        - "ETH"
      # Orderbook configuration (Binance partial depth max: 20 levels)
      orderbook_enabled: true
      orderbook_depth: 20
      orderbook_redis_prefix: "binance_spot_ob"
      # Trades configuration
      trades_enabled: true
      trades_limit: 50
      trades_redis_prefix: "binance_spot_trades"

    futures:
      enabled: true
      auto_start: true
      websocket_url: "wss://fstream.binance.com"
      symbols:
        - "BTCUSDT"
        - "ETHUSDT"
        - "SOLUSDT"
        - "BNBUSDT"
        - "DOGEUSDT"
      reconnect_interval: 5
      max_reconnect_attempts: 10
      redis_prefix: "binance_futures"
      redis_ttl: 60
      quote_currencies:
        - "USDT"
      # Orderbook (Binance USD-M Futures partial depth: max 20 levels)
      orderbook_enabled: true
      orderbook_depth: 20
      orderbook_redis_prefix: "binance_futures_ob"
      # Trades (aggTrade stream)
      trades_enabled: true
      trades_limit: 50
      trades_redis_prefix: "binance_futures_trades"
      # Funding rate (markPrice stream)
      funding_enabled: true

    options:
      enabled: true
      auto_start: true

      # API endpoints
      rest_api_url: "https://eapi.binance.com/eapi/v1/exchangeInfo"
      websocket_url: "wss://nbstream.binance.com/eoptions/ws"

      # Symbol filtering
      underlying_assets:
        - "BTC"
        - "ETH"
      subscribe_all: false           # false = top N by nearest expiry per underlying
      max_symbols_per_asset: 100     # Top 100 per underlying (sorted by nearest expiry)
      max_active_symbols: 500

      # Connection settings (Binance eOptions: max 200 streams per connection)
      max_streams_per_connection: 180  # Leave headroom below 200 limit
      subscription_batch_size: 50      # Params per SUBSCRIBE message
      subscription_batch_delay: 0.1    # Seconds between subscription batches
      symbol_refresh_interval: 3600    # Refresh symbols every 1 hour

      reconnect_interval: 5
      max_reconnect_attempts: 10

      # Redis
      redis_prefix: "binance_options"
      redis_ttl: 60

      # Orderbook (optional - disabled by default, ticker data only)
      orderbook_enabled: false
      orderbook_depth: 20              # 10, 20, 50, or 100
      orderbook_redis_prefix: "binance_options_ob"

      # Trades (optional - disabled by default)
      trades_enabled: false
      trades_limit: 50
      trades_redis_prefix: "binance_options_trades"
