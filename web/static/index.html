<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price LTP Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="glass-card glass-header">
            <div class="header-content">
                <div class="header-left">
                    <h1>Crypto Price LTP</h1>
                    <span class="version-tag" id="version-tag">v-</span>
                </div>
                <div class="header-stats">
                    <div class="stat-chip">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="total-services">-</span>
                    </div>
                    <div class="stat-chip stat-running">
                        <span class="stat-label">Running</span>
                        <span class="stat-value" id="running-services">-</span>
                    </div>
                    <div class="stat-chip">
                        <span class="stat-label">Stopped</span>
                        <span class="stat-value" id="stopped-services">-</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Global Action Bar -->
        <div class="global-actions glass-card">
            <div class="action-bar-left">
                <input type="text" id="search-input" class="search-input" placeholder="Filter services..." />
            </div>
            <div class="action-bar-right">
                <button id="start-all-btn" class="btn btn-start-all">Start All</button>
                <button id="stop-all-btn" class="btn btn-stop-all">Stop All</button>
            </div>
        </div>

        <!-- Main Content -->
        <main>
            <div id="exchanges-container"></div>
        </main>

        <!-- Loading -->
        <div id="loading" class="loading glass-card">
            <div class="spinner"></div>
            <p>Loading services...</p>
        </div>

        <!-- Error -->
        <div id="error-message" class="error-message glass-card" style="display: none;">
            <p id="error-text"></p>
            <button onclick="location.reload()">Retry</button>
        </div>

        <!-- Toast container for notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Footer -->
        <footer>
            <p>Crypto Price LTP | Auto-refresh: <span id="refresh-countdown">2</span>s</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
